spring:
  application:
    name: restaurant-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_db
    username: postgres
    password: 123456789

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html